context:
  version: "1.2"

package:
  name: meshoptimizer
  version: ${{ version }}

source:
  url: https://github.com/zeux/meshoptimizer/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e40f71b809cdf3361b9a4def85fd44534e8733ce29d4b943c145b76859e4c2b4

build:
  number: 0
  script:
    - if: unix
      then: >-
        cmake -S . -B build-shared -G Ninja ${CMAKE_ARGS}
        -DCMAKE_BUILD_TYPE=Release
        -DMESHOPT_BUILD_SHARED_LIBS=ON
        -DMESHOPT_STABLE_EXPORTS=ON
        -DMESHOPT_INSTALL=ON
        -DMESHOPT_BUILD_DEMO=OFF
        -DMESHOPT_BUILD_GLTFPACK=OFF
    - if: win
      then: >-
        cmake -S . -B build-shared -G Ninja %CMAKE_ARGS%
        -DCMAKE_BUILD_TYPE=Release
        -DMESHOPT_BUILD_SHARED_LIBS=ON
        -DMESHOPT_STABLE_EXPORTS=ON
        -DMESHOPT_INSTALL=ON
        -DMESHOPT_BUILD_DEMO=OFF
        -DMESHOPT_BUILD_GLTFPACK=OFF
    - cmake --build build-shared --parallel ${{ CPU_COUNT }}
    - cmake --install build-shared

    # Build the demo against a static library because v1.2's demo exercises
    # experimental APIs that are intentionally hidden from the shared library.
    - if: unix
      then: >-
        cmake -S . -B build-demo -G Ninja ${CMAKE_ARGS}
        -DCMAKE_BUILD_TYPE=Release
        -DMESHOPT_BUILD_SHARED_LIBS=OFF
        -DMESHOPT_INSTALL=OFF
        -DMESHOPT_BUILD_DEMO=ON
        -DMESHOPT_BUILD_GLTFPACK=OFF
    - if: win
      then: >-
        cmake -S . -B build-demo -G Ninja %CMAKE_ARGS%
        -DCMAKE_BUILD_TYPE=Release
        -DMESHOPT_BUILD_SHARED_LIBS=OFF
        -DMESHOPT_INSTALL=OFF
        -DMESHOPT_BUILD_DEMO=ON
        -DMESHOPT_BUILD_GLTFPACK=OFF
    - cmake --build build-demo --target demo --parallel ${{ CPU_COUNT }}
    - if: unix
      then:
        - mkdir -p "${PREFIX}/bin"
        - install -m 755 build-demo/meshoptdemo "${PREFIX}/bin/meshoptdemo"
    - if: win
      then:
        - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
        - copy /Y build-demo\meshoptdemo.exe "%LIBRARY_BIN%\meshoptdemo.exe"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('meshoptimizer', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - meshoptimizer.h
      lib:
        - meshoptimizer
      bin:
        - meshoptdemo
  - script:
      - if: unix
        then:
          - meshoptdemo
          - cmake -S test -B test-build -G Ninja ${CMAKE_ARGS}
          - cmake --build test-build --parallel ${{ CPU_COUNT }}
          - ./test-build/test_meshoptimizer
      - if: win
        then:
          - meshoptdemo.exe
          - cmake -S test -B test-build -G Ninja %CMAKE_ARGS%
          - cmake --build test-build --parallel ${{ CPU_COUNT }}
          - .\\test-build\\test_meshoptimizer.exe
    files:
      recipe:
        - test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja

about:
  homepage: https://meshoptimizer.org
  summary: Mesh optimization library that makes meshes smaller and faster to render
  description: |
    When a GPU renders triangle meshes, various stages of the GPU pipeline have to process vertex and index data.
    The efficiency of these stages depends on the data you feed to them;
    this library provides algorithms to help optimize meshes for these stages,
    as well as algorithms to reduce the mesh complexity and storage overhead.
  license: MIT
  license_file: LICENSE.md
  documentation: https://meshoptimizer.org
  repository: https://github.com/zeux/meshoptimizer

extra:
  recipe-maintainers:
    - multimeric
